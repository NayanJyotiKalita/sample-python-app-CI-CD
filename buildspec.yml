version: 0.2

env:
  parameter-store:
    DOCKER_REGISTRY_URL: /myawspyapp/docker-registry/url
    DOCKER_REGISTRY_USERNAME: /myawspyapp/docker-credentials/username
    DOCKER_REGISTRY_PASSWORD: /myawspyapp/docker-credentials/password
    
phases:
  install:
    runtime-versions:
      python: 3.11
  pre_build:
    commands:
      - echo "Installing dependencies"
      - pip install -r requirements.txt  
  build:
    commands:
      - echo "Building Docker Image"
      - docker build -t "$DOCKER_REGISTRY_URL/$DOCKER_REGISTRY_USERNAME/sample-python-flask-app:latest"  
      - docker push "$DOCKER_REGISTRY_URL/$DOCKER_REGISTRY_USERNAME/sample-python-flask-app:latest"  
  post_build:
    commands:
      - echo "Build is completed"
